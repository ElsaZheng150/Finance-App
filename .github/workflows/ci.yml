name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and test backend
        working-directory: backend
        run: |
          npm install
          npm test
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
